<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Verdant Roast{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/coffee_style.css') }}">
</head>
<body>

    <header class="main-header">
        <nav class="main-nav">
            <a href="{{ url_for('coffee_index') }}" class="logo">Verdant Roast</a>
            <ul>
                <li><a href="{{ url_for('coffee_index') }}#shop">Shop</a></li>
                <li><a href="{{ url_for('coffee_index') }}#sustainability">Our Story</a></li>
                {% if 'user_id' in session %}
                    <li><a href="{{ url_for('profile') }}">Profile</a></li>
                    <li><a href="{{ url_for('logout') }}">Logout</a></li>
                {% else %}
                    <li><a href="{{ url_for('login') }}">Login</a></li>
                    <li><a href="{{ url_for('signup') }}">Sign Up</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="main-footer">
        <p>&copy; 2024 Verdant Roast. All Rights Reserved.</p>
    </footer>

</body>
</html>
